<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<link rel="icon" href="data:,">
<title>Quy luật di truyền liên kết | Khoa học tự nhiên 9</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#195856; --brand-dark:#0f3f3d; --brand-light:#2f827d; --brand-soft:#e6f0ee;
  --ink:#10302d; --muted:#5f8b89; --line:#dbe8e5; --stage-mid:#f1f9f7; --stage-bottom:#dcebe7;
  --ok:#6fa85b; --bad:#c96a4f; --r:16px; --r-sm:11px;
  --blue:#2a5b92; --orange:#c7701a;
  --sh-1:0 1px 2px rgba(13,42,40,.05);
  --sh-2:0 2px 6px rgba(13,42,40,.06),0 18px 34px -22px rgba(13,42,40,.45);
  --sh-3:0 10px 30px -12px rgba(13,42,40,.32);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Roboto',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.5;color:var(--ink);background:#195658;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit}
.hide{display:none!important}
.app{height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:#195658}

/* topbar */
.topbar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);box-shadow:var(--sh-1);z-index:20;flex:0 0 auto}
.logoclip{height:27px;display:flex;align-items:center;flex:0 0 auto}
.logoclip .logo{height:27px;display:block}
.titles{flex:1;min-width:0}
.badge{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--brand);background:var(--brand-soft);border-radius:99px;padding:2px 9px;margin-bottom:2px}
.titles h1{margin:0;font-weight:700;font-size:18px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-btn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--brand-dark);transition:background .15s,border-color .15s}
.tb-btn:hover{background:var(--brand-soft);border-color:var(--brand-light)}
.tb-btn svg{width:18px;height:18px}

/* layout */
.main{flex:1;min-height:0;display:flex;flex-direction:column;padding:14px;overflow:hidden;background:#195658}
.frame{background:#fff;border-radius:var(--r);box-shadow:var(--sh-2);display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden}
.stage{position:relative;flex:1;min-height:0;background:#195658;overflow:hidden}
.vignette{position:absolute;inset:0;z-index:1;pointer-events:none;box-shadow:inset 0 0 90px rgba(15,63,61,.10)}
.stage-tools{position:absolute;left:12px;top:12px;z-index:5;display:flex;gap:8px;flex-wrap:wrap}
.ghost{background:rgba(255,255,255,.88);backdrop-filter:blur(8px) saturate(1.3);border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 11px;font-size:12.5px;font-weight:500;color:var(--brand-dark);cursor:pointer;display:flex;align-items:center;gap:6px;box-shadow:var(--sh-1)}
.ghost:hover{background:#fff}
.ghost.on,.ghost[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
.stage-nav{position:absolute;top:50%;z-index:6;transform:translateY(-50%);width:38px;height:38px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.88);backdrop-filter:blur(8px) saturate(1.3);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--brand-dark);box-shadow:var(--sh-1);font-size:16px}
.stage-nav:hover:not(:disabled){background:var(--brand-soft)}
.stage-nav:disabled{opacity:.4;cursor:not-allowed}
.stage-nav.prev{left:12px}.stage-nav.next{right:12px}
.stage-nav.nudge{animation:nudgePulse 1.2s ease infinite}
@keyframes nudgePulse{0%,100%{box-shadow:0 0 0 0 rgba(25,88,86,.55)}50%{box-shadow:0 0 0 9px rgba(25,88,86,0)}}

/* vùng hình ảnh trên sân khấu */
.vis{position:absolute;z-index:2;left:62px;top:56px;bottom:12px;right:calc(min(540px,46%) + 72px);display:flex;flex-direction:column;gap:10px;overflow:auto;scrollbar-width:thin}
.vcard{background:rgba(255,255,255,.94);border-radius:var(--r);box-shadow:var(--sh-3);padding:12px 14px}
.vcard h4{margin:0 0 6px;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand-light)}
.vrow{display:flex;gap:10px;flex-wrap:wrap}
.vrow>.vcard{flex:1;min-width:200px}
.v3d{position:absolute;inset:0}
.v3d canvas{display:block;width:100%;height:100%}

/* bảng bài học */
.lesson{position:absolute;z-index:7;right:60px;top:12px;bottom:12px;width:min(540px,46%);display:flex;flex-direction:column;background:rgba(255,255,255,.94);backdrop-filter:blur(12px) saturate(1.3);border-radius:var(--r);box-shadow:var(--sh-3);overflow:hidden}
.lesson-head{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 16px;border-bottom:1px solid var(--line);font-size:12px;font-weight:700;color:var(--brand-dark);letter-spacing:.04em;text-transform:uppercase;flex:0 0 auto}
.lesson-head span{flex:1}
.lesson-head button{width:28px;height:28px;border-radius:99px;border:none;background:var(--brand-soft);color:var(--brand-dark);cursor:pointer;font-size:13px}
.sidebody{flex:1;min-height:0;overflow:auto;padding:18px 20px 16px;background:linear-gradient(#fff,var(--stage-mid) 70%,var(--stage-bottom));-webkit-overflow-scrolling:touch}
.lesson.collapsed{bottom:auto}
.lesson.collapsed .sidebody{display:none}
.sec{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand-light);margin:0 0 4px}
.sec h2{margin:0 0 8px;font-size:21px;line-height:1.3;color:var(--brand-dark)}
.lead{font-size:15px;line-height:1.65;margin:8px 0}
.muted{color:var(--muted)}
.chip{display:inline-block;font-size:12px;font-weight:700;color:var(--brand);background:var(--brand-soft);border-radius:99px;padding:3px 11px;margin-bottom:6px}
.counter{display:inline-block;font-size:12px;font-weight:700;color:#6b4d13;background:#fff6dd;border:1px solid #f0dca6;border-radius:99px;padding:3px 11px;margin:0 0 6px 6px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1);padding:14px 16px;margin:12px 0}
.card h3{margin:0 0 6px;font-size:16px;color:var(--brand-dark)}
.kcard{border-radius:var(--r-sm);padding:12px 14px;margin-top:10px;border:1.5px solid var(--line);background:#fff;box-shadow:var(--sh-1)}
.kcard .kh{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--brand-light);margin-bottom:5px}
.kcard .dot{width:10px;height:10px;border-radius:50%;background:var(--brand-light);flex:0 0 auto}
.kcard.cap .dot{background:#b86fc2}.kcard.cap .kh{color:#8a4795}
.kcard p{margin:0;font-size:14.5px;line-height:1.6}
.kcard ul{margin:2px 0 0;padding-left:20px;font-size:14.5px;line-height:1.6}
.checks{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.check{display:flex;align-items:center;gap:10px;padding:10px 13px;border-radius:var(--r-sm);border:1.5px dashed #cdbd9f;background:#fffaef;font-weight:600;font-size:14.5px}
.check b{flex:0 0 24px;height:24px;border-radius:50%;background:#fff;border:2px solid #cdbd9f;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px}
.check.done{border-style:solid;border-color:var(--ok);background:#eef7e9;color:#3f6b32}
.check.done b{background:var(--ok);border-color:var(--ok)}
.opts{display:flex;flex-direction:column;gap:8px;margin:10px 0 0}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:11px 13px;border-radius:var(--r-sm);border:1.5px solid var(--line);background:#fff;color:var(--ink);font-size:14.5px;cursor:pointer;transition:border-color .15s,background .15s}
.opt i{font-style:normal;flex:0 0 24px;height:24px;border-radius:50%;background:var(--brand-soft);color:var(--brand);font-weight:700;font-size:12.5px;display:flex;align-items:center;justify-content:center}
.opt:hover:not(:disabled){border-color:var(--brand-light);background:var(--stage-mid)}
.opt:disabled{cursor:default}
.opt.sel{border-color:var(--brand-light);background:var(--brand-soft)}
.opt.ok{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-dark);font-weight:600}
.opt.ok i{background:var(--brand);color:#fff}
.opt.no{border-color:var(--bad);background:#fbeae4;color:#a54527}
.opt.no i{background:var(--bad);color:#fff}
.fb{display:none;margin:9px 0 0;padding:10px 13px;border-radius:var(--r-sm);font-size:14px;line-height:1.6}
.fb.show{display:block}
.fb.ok{background:var(--brand-soft);color:var(--brand-dark)}
.fb.no{background:#fbeae4;color:#a54527}
.fb.info{background:#fff6dd;color:#6b4d13}
.qbtn{border:0;border-radius:11px;padding:10px 18px;font-size:14.5px;font-weight:600;cursor:pointer;background:var(--brand);color:#fff;margin:10px 8px 0 0}
.qbtn:hover:not(:disabled){background:var(--brand-dark)}
.qbtn:disabled{opacity:.4;cursor:not-allowed}
.qbtn.alt{background:#fff;color:var(--brand);border:1.5px solid var(--brand)}
.qbtn.alt:hover:not(:disabled){background:var(--brand-soft)}
.qbtn.nudge{animation:nudgePulse 1.2s ease infinite}
a.qbtn{display:inline-block;text-decoration:none}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.seg button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 14px;font-size:13.5px;font-weight:600;color:var(--ink);cursor:pointer}
.seg button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.seg button.nudge{animation:nudgePulse 1.2s ease infinite}

/* lời cô giáo */
.nar{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-left:4px solid var(--brand-light);border-radius:var(--r-sm);padding:10px 12px;margin:0 0 12px;box-shadow:var(--sh-1)}
.nar .av{flex:0 0 30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center}
.nar .tx{font-size:14.5px;line-height:1.6}

/* ruồi giấm */
.fly{display:inline-flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);text-align:center;line-height:1.25}
.fly svg{width:74px;height:48px}
.fly.sm svg{width:48px;height:32px}

/* kéo thả */
.dc{touch-action:none;user-select:none;-webkit-user-select:none;background:#fff;border:1.5px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;font-size:13px;font-weight:500;cursor:grab;box-shadow:var(--sh-1);display:inline-flex;align-items:center;justify-content:center;gap:4px;text-align:center;color:var(--ink)}
.dc.sel{border-color:var(--brand);box-shadow:0 0 0 3px rgba(47,130,125,.25);background:var(--brand-soft)}
.dc.flyc{flex-direction:column;padding:6px 10px}
.ghostc{position:fixed;z-index:999;pointer-events:none;opacity:.95;margin:0;cursor:grabbing;transform:rotate(-2deg);box-shadow:0 10px 22px rgba(0,0,0,.28)}
.dc.dragging{opacity:.35}
.dc{-webkit-touch-callout:none}
.slot.hover{border-style:solid;border-color:var(--brand-light);background:var(--brand-soft);box-shadow:0 0 0 3px rgba(47,130,125,.22)}
.tray{display:flex;gap:8px;flex-wrap:wrap;min-height:52px;padding:10px;border:1.5px dashed #cdbd9f;border-radius:var(--r-sm);background:#fffaef;margin-top:8px}
.slot{min-height:58px;border:1.5px dashed #cdbd9f;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;padding:4px;background:#fffaef;text-align:center;font-size:12.5px;color:#a08c63;font-weight:500}
.slot.filled{border-style:solid;border-color:var(--line);background:#fff;color:var(--ink)}
.slot.bad{border-color:var(--bad);background:#fbeae4}
.slot.good{border-color:var(--ok);background:#eef7e9}
.slot .dc{box-shadow:none;border:0;background:transparent}
.slots2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.count{font-size:13px;color:var(--muted);font-weight:500}
table.cmp{border-collapse:separate;border-spacing:5px;width:100%;margin-top:6px}
table.cmp th{font-size:12.5px;padding:7px 8px;border-radius:9px;color:#fff;font-weight:700}
table.cmp th.rl{background:var(--brand-soft);color:var(--brand-dark);text-align:left;width:27%}
table.cmp th.a{background:var(--blue)}table.cmp th.b{background:var(--orange)}
table.cmp td.slot{width:36.5%;display:table-cell;vertical-align:middle;text-align:center}
table.cmp td.slot .dc{display:flex;width:100%}
/* bước cần khung bài học rộng (nửa màn hình) */
@media (min-width:901px){
  .stage.wide .lesson{width:50%}
  .stage.wide .vis{right:calc(50% + 72px)}
}

/* sơ đồ thí nghiệm */
.sb{border:1.5px solid var(--line);border-radius:var(--r-sm);padding:9px 11px;background:#fff;opacity:.3;transition:opacity .4s}
.sb.show{opacity:1}
.sb .h{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin-bottom:4px}
.sb .cross{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.times{font-size:20px;font-weight:700;color:var(--muted)}
.tagc{display:inline-block;background:#fdebd5;border:1px solid #e9c9a4;color:#6b3f17;border-radius:99px;padding:1px 9px;font-size:11px;font-weight:700;text-transform:none;letter-spacing:0}
.bar{display:flex;height:26px;border-radius:8px;overflow:hidden;font-size:12px;font-weight:700;color:#fff;margin-top:8px}
.bar span{display:grid;place-items:center;text-align:center;line-height:1.1}
.zy{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.zy>div{flex:1;min-width:130px;text-align:center;border:1.5px solid var(--line);border-radius:var(--r-sm);padding:8px;background:#fff}
.chip2{display:inline-block;background:#fff6dd;border:1.5px solid #f0dca6;border-radius:var(--r-sm);padding:5px 14px;font-weight:700;margin:4px 6px 0 0}

/* 3D */
.hud{position:absolute;left:12px;bottom:12px;z-index:3;color:#fff;font-size:12.5px;font-weight:500;background:rgba(15,63,61,.72);border:1.5px solid rgba(255,255,255,.4);border-radius:99px;padding:6px 13px}
.lines3d{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.lines3d line{stroke:#fff;stroke-width:1.6;opacity:.9}
.lines3d circle{fill:#fff;stroke:var(--brand);stroke-width:2}
.lbl{position:absolute;left:0;top:0;pointer-events:none;font-weight:700;font-size:14px;color:#fff;transform:translate(-50%,-50%);white-space:nowrap;z-index:4;transition:opacity .3s}
.lbl.g{background:#fff;color:var(--ink);border-radius:7px;min-width:24px;text-align:center;padding:1px 7px;font-size:14px;box-shadow:0 2px 6px rgba(0,0,0,.28)}
.lbl.gam{background:rgba(15,63,61,.78);border:1.5px solid rgba(255,255,255,.55);border-radius:99px;padding:4px 12px;font-size:13px}
.tagbtn{white-space:nowrap;position:absolute;z-index:5;transform:translate(-50%,-50%);padding:7px 14px;border-radius:10px;border:1.5px solid #e9c9a4;background:#fdebd5;color:#6b3f17;font-weight:700;font-size:14px;cursor:pointer;box-shadow:var(--sh-3)}
.tagbtn.l{transform:translate(0,-50%)}
.tagbtn.r{transform:translate(-100%,-50%)}
.tagbtn:hover{background:#fff4e4}
.tagbtn.done{background:#eef7e9;border-color:var(--ok);color:#3f6b32}
.tagbtn.cap{cursor:default;pointer-events:none;background:rgba(255,255,255,.92);border-color:var(--line);color:var(--brand-dark);font-size:13px}

/* khái niệm */
.concept{font-size:17px;line-height:2.3}
.concept select{font:inherit;font-size:15px;padding:4px 8px;border-radius:9px;border:1.5px solid var(--line);background:#fff;color:var(--ink)}
.concept select.bad{border-color:var(--bad);background:#fbeae4}
.concept select.good{border-color:var(--ok);background:#eef7e9}

/* kết quả tìm kiếm */
.sr{border:1.5px solid var(--line);border-radius:var(--r-sm);padding:9px 12px;margin-top:8px;display:block;background:#fff;width:100%;text-align:left;cursor:pointer}
.sr.sel{border-color:var(--brand-light);background:var(--brand-soft)}.sr.ok{border-color:var(--ok);background:#eef7e9}.sr.no{border-color:var(--bad);background:#fbeae4}
.sr .u{color:#1a7f3c;font-size:12px}.sr .t{color:#1a0dab;font-weight:500;font-size:15px}.sr .d{font-size:13px;color:var(--muted)}
.kw{display:flex;gap:8px;align-items:center;background:var(--stage-mid);border:1.5px solid var(--line);border-radius:var(--r-sm);padding:6px 6px 6px 12px;font-weight:600}
.kw span{flex:1}
.kw .qbtn{margin:0;padding:6px 12px;font-size:13px}
ol.s3{padding-left:20px;margin:8px 0;font-size:14.5px}

/* thanh bước */
.steps{display:flex;gap:8px;padding:10px 12px;overflow-x:auto;overflow-y:hidden;border-top:1px solid var(--line);scrollbar-width:none;flex:0 0 auto}
.steps::-webkit-scrollbar{display:none}
.step{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:7px 13px 7px 8px;border-radius:99px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:13px;font-weight:500;color:var(--ink);white-space:nowrap;transition:background .15s,border-color .15s}
.step b{width:20px;height:20px;border-radius:99px;background:var(--brand-soft);color:var(--brand-dark);font-size:11px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.step:hover:not(:disabled){border-color:var(--brand-light)}
.step:disabled{opacity:.45;cursor:not-allowed}
.step[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.step[aria-pressed="true"] b{background:rgba(255,255,255,.25);color:#fff}
.step.done b{background:var(--brand);color:#fff}

/* màn mở đầu */
.intro-loader{position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;padding:18px;overflow:hidden;transition:opacity .5s;background:radial-gradient(80% 70% at 50% 40%,#2f827d 0,#195856 58%,#0b2a29 100%)}
.intro-loader::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,20,23,.08),rgba(6,20,23,.52));pointer-events:none}
.intro-loader.gone{opacity:0;pointer-events:none}
.intro-inner{position:relative;z-index:1;width:100%;max-width:920px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.intro-card{width:min(92vw,980px);padding:8px 12px 12px;text-align:center;color:#fff}
.intro-kicker{font-size:12px;font-weight:700;letter-spacing:.20em;text-transform:uppercase;color:rgba(248,252,252,.92)}
.intro-card h1{font-size:clamp(32px,5vw,66px);margin:10px 0 12px;color:#fff;line-height:1.08;font-weight:800;text-shadow:0 4px 18px rgba(0,0,0,.26);text-wrap:balance}
.intro-sub{max-width:720px;margin:0 auto 22px;font-size:clamp(13px,1.8vw,20px);color:rgba(244,249,249,.96);line-height:1.72;text-shadow:0 2px 10px rgba(0,0,0,.22)}
.intro-explore{width:min(280px,88vw);padding:14px 18px;border-radius:999px;border:1px solid rgba(255,255,255,.16);cursor:pointer;background:rgba(21,92,88,.76);color:#fff;font-weight:700;font-size:15px;letter-spacing:.02em;box-shadow:0 16px 42px -20px rgba(0,0,0,.6)}
.intro-explore:hover{background:rgba(21,92,88,.9)}
.intro-credit{color:rgba(255,255,255,.88);font-size:12px;text-shadow:0 2px 8px rgba(0,0,0,.24)}

@media (max-width:900px){
  .main{padding:10px}
  .stage-nav{width:34px;height:34px;font-size:14px;top:26%}
  .lesson{left:8px;right:8px;top:auto;bottom:8px;width:auto;height:50%}
  .lesson.collapsed{height:auto}
  .vis{left:50px;right:50px;top:52px;bottom:calc(50% + 16px)}
  .titles h1{font-size:15px}
  .sec h2{font-size:18px}
  .sidebody{padding:14px 14px 12px}
  .concept{font-size:15px}
  .step span{display:none}
  .step{padding:7px 8px}
  .step[aria-pressed="true"] span{display:inline}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
/* ============ cấu hình (GV chỉnh tại đây) ============ */
const CONFIG = {
  nextPartUrl: "2. Ứng dụng di truyền liên kết.html"
};
const DEV = /[?&]dev\b/.test(location.search);   // ?dev → mở khoá mọi bước để xem thử

/* ============ tiện ích ============ */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]} return a; };
const store = { get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}} };

function flySVG(body, wing){
  const c = body==='xam' ? '#9aa0a6' : '#2b2b2b';
  const stripe = body==='xam' ? '#7c838a' : '#555';
  const w = wing==='dai'
    ? '<ellipse cx="30" cy="13" rx="27" ry="7" fill="#cfe6f5" fill-opacity=".8" stroke="#6f9cb8" stroke-width="1" transform="rotate(-8 30 13)"/>'
    : '<ellipse cx="46" cy="15" rx="8" ry="4" fill="#cfe6f5" fill-opacity=".8" stroke="#6f9cb8" stroke-width="1"/>';
  return `<svg viewBox="0 0 80 50" aria-hidden="true">
   <g stroke="#333" stroke-width="1.4"><line x1="42" y1="32" x2="38" y2="44"/><line x1="50" y1="32" x2="52" y2="44"/><line x1="34" y1="32" x2="28" y2="43"/></g>
   <ellipse cx="26" cy="27" rx="17" ry="10" fill="${c}"/>
   <path d="M18 18v18M25 17v20M32 18v18" stroke="${stripe}" stroke-width="2" fill="none"/>
   <ellipse cx="47" cy="25" rx="10" ry="9" fill="${c}"/>
   <circle cx="62" cy="25" r="8" fill="${c}"/><circle cx="65" cy="22" r="3.4" fill="#c0392b"/>
   ${w}</svg>`;
}
const flyHTML = (body, wing, label, cls='') => `<span class="fly ${cls}">${flySVG(body,wing)}${label?`<span>${label}</span>`:''}</span>`;
const F_XD = (l=true,c='') => flyHTML('xam','dai',l?'Thân xám, cánh dài':'',c);
const F_DC = (l=true,c='') => flyHTML('den','cut',l?'Thân đen, cánh cụt':'',c);
const F_XC = (l=true,c='') => flyHTML('xam','cut',l?'Thân xám, cánh cụt':'',c);
const F_DD = (l=true,c='') => flyHTML('den','dai',l?'Thân đen, cánh dài':'',c);

/* NST dạng SVG (minh hoạ tĩnh) */
function chrom(x,y,len,color,genes){ // genes: [{dy,color,label,side}]
  let s=`<rect x="${x-9}" y="${y}" width="18" height="${len}" rx="9" fill="${color}"/>`;
  genes.forEach(g=>{ s+=`<rect x="${x-11}" y="${y+g.dy-5}" width="22" height="10" rx="2" fill="${g.color}"/><text x="${x+(g.side<0?-18:18)}" y="${y+g.dy+4}" text-anchor="${g.side<0?'end':'start'}" font-size="12" font-weight="700" fill="#10302d">${g.label}</text>`; });
  return s;
}

/* DnD dùng chung: kéo thả hoặc chọn thẻ rồi chạm ô */
function board(root, cards, correct, onChange){
  const tray = $('.tray', root);
  const placed = {};
  let sel = null;
  const cells = $$('.slot', root);
  const els = {};
  shuffle(cards).forEach(c=>{
    const e = document.createElement('div');
    e.className = 'dc'+(c.cls?' '+c.cls:''); e.dataset.id = c.id; e.innerHTML = c.html;
    tray.appendChild(e); els[c.id]=e; bind(e);
  });
  const cellOf = e => e.closest('.slot');
  const count = () => Object.keys(placed).length;
  function put(card, cell){
    const old = cellOf(card);
    if(old===cell){ setSel(null); return; }
    if(old){ delete placed[old.dataset.cell]; old.classList.remove('filled','bad','good'); }
    const prev = placed[cell.dataset.cell];
    if(prev && els[prev]!==card){ tray.appendChild(els[prev]); }
    cell.textContent=''; cell.appendChild(card); cell.classList.add('filled'); cell.classList.remove('bad','good');
    if(old && !old.children.length) old.textContent=old.dataset.ph||'';   // trả lại chữ "Thả thẻ" cho ô cũ
    placed[cell.dataset.cell]=card.dataset.id;
    setSel(null); onChange&&onChange(count());
  }
  function back(card){
    const old = cellOf(card);
    if(old){ delete placed[old.dataset.cell]; old.classList.remove('filled','bad','good'); old.textContent=old.dataset.ph||''; }
    tray.appendChild(card); setSel(null); onChange&&onChange(count());
  }
  function setSel(e){ if(sel) sel.classList.remove('sel'); sel=e; if(e) e.classList.add('sel'); }
  // tìm ô đích: ưu tiên ô dưới con trỏ; nếu thả vào khe giữa các ô thì lấy ô bị thẻ che nhiều nhất
  function findSlot(x,y,g){
    const t=document.elementFromPoint(x,y), s=t&&t.closest('.slot');
    if(s && root.contains(s)) return s;
    let best=null, area=0;
    cells.forEach(c=>{ const r=c.getBoundingClientRect();
      const a=Math.max(0,Math.min(g.right,r.right)-Math.max(g.left,r.left))*Math.max(0,Math.min(g.bottom,r.bottom)-Math.max(g.top,r.top));
      if(a>area){ area=a; best=c; } });
    return best;
  }
  function bind(e){
    e.draggable=false;
    e.addEventListener('dragstart',ev=>ev.preventDefault());     // chặn kéo-thả mặc định của trình duyệt
    e.addEventListener('contextmenu',ev=>ev.preventDefault());   // chặn menu khi nhấn giữ trên màn cảm ứng
    e.addEventListener('pointerdown',ev=>{
      if(ev.pointerType==='mouse' && ev.button!==0) return;
      ev.preventDefault();                                        // không bôi đen chữ, không kéo ảnh
      const id=ev.pointerId, sx=ev.clientX, sy=ev.clientY, r=e.getBoundingClientRect(), ox=sx-r.left, oy=sy-r.top;
      let drag=false, ghost=null, hover=null;
      const move=m=>{
        if(m.pointerId!==id) return;
        if(!drag && Math.hypot(m.clientX-sx,m.clientY-sy)>5){
          drag=true; setSel(null);
          ghost=e.cloneNode(true); ghost.classList.add('ghostc'); ghost.classList.remove('sel');
          ghost.style.width=r.width+'px'; ghost.style.height=r.height+'px';
          document.body.appendChild(ghost); e.classList.add('dragging');
        }
        if(!drag) return;
        m.preventDefault();
        ghost.style.left=(m.clientX-ox)+'px'; ghost.style.top=(m.clientY-oy)+'px';   // giữ đúng chỗ đang cầm thẻ
        const t=findSlot(m.clientX,m.clientY,ghost.getBoundingClientRect());
        if(t!==hover){ hover&&hover.classList.remove('hover'); hover=t; t&&t.classList.add('hover'); }
      };
      const end=u=>{
        if(u.pointerId!==id) return;
        document.removeEventListener('pointermove',move); document.removeEventListener('pointerup',end); document.removeEventListener('pointercancel',end);
        if(ghost) ghost.remove(); if(hover) hover.classList.remove('hover'); e.classList.remove('dragging');
        if(u.type!=='pointerup') return;
        if(drag){
          if(hover) put(e,hover);
          else { const t=document.elementFromPoint(u.clientX,u.clientY); if(t && (t===tray||tray.contains(t))) back(e); }
        } else {
          if(cellOf(e)) back(e); else setSel(sel===e?null:e);
        }
      };
      document.addEventListener('pointermove',move,{passive:false});
      document.addEventListener('pointerup',end); document.addEventListener('pointercancel',end);
    });
  }
  cells.forEach(c=>{ c.dataset.ph = c.textContent.trim(); c.addEventListener('click',ev=>{ if(sel && ev.target===c) put(sel,c); }); });
  return {
    placed, count,
    check(){
      let all=true;
      cells.forEach(c=>{
        const ok = placed[c.dataset.cell]===correct[c.dataset.cell];
        c.classList.remove('good','bad');
        if(placed[c.dataset.cell]) c.classList.add(ok?'good':'bad');
        if(!ok) all=false;
      });
      return all;
    },
    lock(){ $$('.dc',root).forEach(c=>c.style.pointerEvents='none'); }
  };
}

/* Trắc nghiệm dùng chung */
function quiz(host, {q, opts, multi=false, correct, ok, bad, hint, onDone}){
  let wrong=0, done=false; const chosen=new Set();
  const L='ABCDEFG';
  host.innerHTML = `<h3>Chọn đáp án đúng</h3><p style="margin:0">${q}</p><div class="opts">${
    opts.map((o,i)=>`<button class="opt" data-i="${i}"><i>${L[i]}</i><span>${o}</span></button>`).join('')
  }</div>${multi?'<div><button class="qbtn q-check" disabled>Kiểm tra</button></div>':''}<div class="fb"></div>`;
  const fb = $('.fb',host);
  const show=(cls,t)=>{ fb.className='fb show '+cls; fb.innerHTML=t; };
  function finish(good){
    if(good){ done=true; show('ok','<b>Chính xác!</b> '+ok); $$('.opt',host).forEach(o=>o.disabled=true); onDone&&onDone(); return; }
    wrong++;
    wrong>=2 ? show('info','<b>Cô gợi ý:</b> '+hint) : show('no',bad);
  }
  $$('.opt',host).forEach(b=>b.addEventListener('click',()=>{
    if(done) return;
    const i=+b.dataset.i;
    if(multi){
      b.classList.toggle('sel'); chosen.has(i)?chosen.delete(i):chosen.add(i);
      $('.q-check',host).disabled = chosen.size===0;
    } else {
      $$('.opt',host).forEach(o=>o.classList.remove('no','ok'));
      const good = correct.includes(i);
      b.classList.add(good?'ok':'no'); finish(good);
    }
  }));
  if(multi) $('.q-check',host).addEventListener('click',()=>{
    const good = chosen.size===correct.length && correct.every(i=>chosen.has(i));
    $$('.opt',host).forEach(o=>{o.classList.remove('no','ok'); if(chosen.has(+o.dataset.i)){ o.classList.remove('sel'); o.classList.add(correct.includes(+o.dataset.i)?'ok':'no'); }});
    finish(good);
  });
}

  function applyOffset(){ const w=host.clientWidth,h=host.clientHeight; if(!w||!h) return; const wide=innerWidth>900; const shift = wide ? Math.min(540,w*.46)+72 : 0; const vs = wide ? 0 : (h*.5+16)/2; camera.setViewOffset(w,h,shift/2,vs,w,h); }

function mini3D(V, units, halfW, halfH){

  function chromo(color,len,cen){ const g=new THREE.Group(); g.add(new THREE.Mesh(rodGeo(len,.27,cen),mat(color))); return g; }
  function band(p,y,c){ const m=new THREE.Mesh(new THREE.CylinderGeometry(.31,.31,.26,36),mat(c)); m.position.y=y; p.add(m); return m; }
  function cell(r,x,y,op){ const m=new THREE.Mesh(new THREE.SphereGeometry(r,48,32),new THREE.ShaderMaterial({transparent:true,depthWrite:false,
      uniforms:{uOp:{value:op},uCol:{value:new THREE.Color(0xc4f1f6)}},
      vertexShader:'varying vec3 vN;varying vec3 vV;void main(){vec4 mv=modelViewMatrix*vec4(position,1.);vN=normalize(normalMatrix*normal);vV=normalize(-mv.xyz);gl_Position=projectionMatrix*mv;}',
      fragmentShader:'uniform float uOp;uniform vec3 uCol;varying vec3 vN;varying vec3 vV;void main(){float f=pow(1.-abs(dot(vN,vV)),2.4);gl_FragColor=vec4(uCol,(.06+.8*f)*uOp);}'}));
    m.position.set(x,y,0); return m; }
  const RED=0xd7473c, BLU=0x3a78e0, GOLD=0xffc93c, VIO=0xa66be0;
  const labels=[];
  function lbl(obj,text,cls,dx=0){ const e=document.createElement('div'); e.className='lbl '+cls; e.textContent=text; host.appendChild(e); const l={obj,el:e,dx}; labels.push(l); return l; }
  function anchor(p,x,y){ const o=new THREE.Object3D(); o.position.set(x,y,0); p.add(o); return o; }
  const U=units.map(u=>{
    const g=new THREE.Group(); g.position.y=u.y||0; scene.add(g);
    const main=cell(3.1,0,0,1), kids=[cell(1.95,-3.8,0,0),cell(1.95,3.8,0,0)]; g.add(main,...kids);
    const o={u,g,main,kids,chs:[],arrange:0};
    const gl=t=>[[t[0],'g',-30],[t[1],'g',30]];
    if(u.type==='link'){
      const R=chromo(RED,3.4,.2), B=chromo(BLU,3.4,.2); R.position.x=-.55; B.position.x=.55; g.add(R,B);
      lbl(band(R,.95,GOLD),'B','g',-30); lbl(band(R,-.8,VIO),'V','g',-30); lbl(band(B,.95,GOLD),'b','g',30); lbl(band(B,-.8,VIO),'v','g',30);
      o.chs=[{c:R,x0:-.55,y0:0,s:-1},{c:B,x0:.55,y0:0,s:1}];
    } else {
      const A1=chromo(RED,1.9,.35),A2=chromo(BLU,1.9,.35),V1=chromo(RED,1.6,-.3),V2=chromo(BLU,1.6,-.3);
      A1.position.set(-.55,1.3,0);A2.position.set(.55,1.3,0);V1.position.set(-.55,-1.3,0);V2.position.set(.55,-1.3,0); g.add(A1,A2,V1,V2);
      lbl(band(A1,-.35,GOLD),'B','g',-30); lbl(band(A2,-.35,GOLD),'b','g',30); lbl(band(V1,.3,VIO),'V','g',-30); lbl(band(V2,.3,VIO),'v','g',30);
      o.chs=[{c:A1,x0:-.55,y0:1.3,s:-1},{c:A2,x0:.55,y0:1.3,s:1},{c:V1,x0:-.55,y0:-1.3,s:-1,v:1},{c:V2,x0:.55,y0:-1.3,s:1,v:1}];
    }
    if(u.title) lbl(anchor(g,0,3.55),u.title,'gam');
    o.gL=lbl(anchor(kids[0],0,2.3),'Giao tử BV','gam'); o.gR=lbl(anchor(kids[1],0,2.3),'Giao tử bv','gam');
    return o;
  });
  const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
  let paused=false, t=0, raf, last=performance.now();
  const CYCLE=10; // 1.5s đứng yên, 6s giảm phân, 2.5s giữ kết quả
  const btn=document.createElement('button'); btn.className='ghost xt'; btn.textContent='⏸ Tạm dừng'; btn.onclick=()=>{ paused=!paused; btn.textContent=paused?'▶ Chạy tiếp':'⏸ Tạm dừng'; }; $('#tools').appendChild(btn);
  const shiftPx=()=>{ const w=host.clientWidth; if(innerWidth<=900) return 0; return (wideStage()? w*.5 : Math.min(540,w*.46))+72; };
  function fit(){ const w=host.clientWidth||800,h=host.clientHeight||600, wide=innerWidth>900, lw=Math.max(220,w-shiftPx()), lh=wide?h:h*.5-16;
    camera.position.set(0,0,Math.max(halfW/(0.4142*lw/h),halfH/(0.4142*lh/h))); controls.target.set(0,0,0); }
  function resize(){ const w=host.clientWidth,h=host.clientHeight; if(!w||!h) return; renderer.setSize(w,h,false); camera.aspect=w/h;
    const wide=innerWidth>900; camera.setViewOffset(w,h,shiftPx()/2, wide?0:(h*.5+16)/2, w,h); camera.updateProjectionMatrix(); }
  const ro=new ResizeObserver(()=>{ resize(); fit(); }); ro.observe(host); resize(); fit();
  const v=new THREE.Vector3();
  function frame(now){
    raf=requestAnimationFrame(frame); const dt=Math.min((now-last)/1000,.05); last=now;
    if(!paused){ const nt=(t+dt)%CYCLE; if(nt<t) U.forEach(o=>o.arrange^=1); t=nt; }
    const e=ease(Math.min(1,Math.max(0,(t-1.5)/6)));
    U.forEach(o=>{
      o.chs.forEach(k=>{ let s=k.s; if(k.v&&o.arrange) s=-s;
        k.c.position.x = s<0 ? -.55-3.25*e : .55+3.25*e;
        if(k.v && o.arrange) k.c.position.x = k.s<0 ? -.55+4.35*e : .55-4.35*e;
        if(o.u.type==='indep') k.c.position.y = k.y0>0 ? 1.3-.45*e : -1.3+.45*e; });
      if(o.u.type==='indep'){ o.gL.el.textContent='Giao tử '+(o.arrange?'Bv':'BV'); o.gR.el.textContent='Giao tử '+(o.arrange?'bV':'bv'); }
      o.gL.el.style.opacity=o.gR.el.style.opacity=e>.95?1:0;
      o.main.material.uniforms.uOp.value=1-Math.min(1,e*1.6); o.kids.forEach(k=>k.material.uniforms.uOp.value=Math.max(0,(e-.35)/.65));
    });
    controls.update(); renderer.render(scene,camera);
    const w=host.clientWidth,h=host.clientHeight;
    labels.forEach(l=>{ l.obj.getWorldPosition(v); v.project(camera); l.el.style.left=((v.x*.5+.5)*w+l.dx)+'px'; l.el.style.top=((-v.y*.5+.5)*h)+'px'; });
  }
  raf=requestAnimationFrame(frame);
  return ()=>{ cancelAnimationFrame(raf); ro.disconnect(); renderer.dispose(); controls.dispose(); V.style.cssText=''; };
}

/* ============ 1d – Khái niệm ============ */
function act1d(P, V){
  const stop3d = mini3D(V,[{type:'link',title:'Cặp NST tương đồng của F1: B và V cùng nằm trên một NST'}],6.4,4.4);
  P.innerHTML = `
  <h2>Khái niệm di truyền liên kết</h2>
  <div class="card">
    <span class="chip">Điền chỗ trống</span>
    <div class="concept">Di truyền liên kết là hiện tượng các
      <select data-k="0"><option value="">…</option><option>gene</option><option>tế bào</option><option>ribosome</option></select>
      quy định các tính trạng cùng nằm trên một
      <select data-k="1"><option value="">…</option><option>nhiễm sắc thể</option><option>tế bào chất</option><option>không bào</option></select>
      có xu hướng di truyền cùng nhau trong quá trình
      <select data-k="2"><option value="">…</option><option>giảm phân</option><option>nguyên phân</option><option>thụ tinh</option></select>.</div>
    <div><button class="qbtn" id="d-check">Kiểm tra</button></div>
    <div class="fb" id="d-fb"></div>
  </div>
  <div class="kcard hide" id="d-box"><div class="kh"><span class="dot"></span>Khái niệm</div>
    <p>Di truyền liên kết là hiện tượng các gene quy định các tính trạng cùng nằm trên một nhiễm sắc thể có xu hướng di truyền cùng nhau trong quá trình giảm phân.</p>
    <p style="margin-top:6px"><b>Ptc → F1 → Fa:</b> 1 thân xám, cánh dài : 1 thân đen, cánh cụt.</p>
    <p style="margin-top:6px">Di truyền liên kết hoàn toàn <b>làm hạn chế biến dị tổ hợp</b>.</p></div>`;
  say('Từ thí nghiệm của Morgan, em hãy hoàn thành khái niệm: chọn từ thích hợp cho 3 chỗ trống rồi bấm <b>Kiểm tra</b>.','concept');
  const ans=['gene','nhiễm sắc thể','giảm phân'];
  $('#d-check').onclick=()=>{
    let all=true;
    $$('select',P).forEach((s,i)=>{ s.classList.remove('good','bad'); const ok=s.value===ans[i]; s.classList.add(ok?'good':'bad'); if(!ok) all=false; });
    const fb=$('#d-fb');
    if(all){
      fbShow(fb,'ok','<b>Chính xác!</b> Di truyền liên kết là hiện tượng các gene quy định các tính trạng cùng nằm trên một nhiễm sắc thể có xu hướng di truyền cùng nhau trong quá trình giảm phân.');
      $$('select',P).forEach(s=>s.disabled=true); $('#d-check').disabled=true;
      $('#d-box').classList.remove('hide');
      say('Chính xác! Di truyền liên kết hoàn toàn làm <b>hạn chế biến dị tổ hợp</b>. Em bấm ▶ để so sánh di truyền liên kết với phân li độc lập.','conceptOk');
      unlock(4);
    } else fbShow(fb,'no','Có chỗ chưa đúng, chỗ sai được tô đỏ, em xem lại hoạt ảnh giảm phân và chọn lại nhé.');
  };
  return stop3d;
}

/* ============ 1e – So sánh hai quy luật ============ */
function act1e(P, V){
  const stop3d = mini3D(V,[{type:'link',y:4.2,title:'Liên kết gene: 1 cặp NST → 2 loại giao tử'},{type:'indep',y:-4.8,title:'Phân li độc lập: 2 cặp NST → 4 loại giao tử'}],6.4,10.2);
  P.innerHTML = `
  <h2>So sánh liên kết gene và phân li độc lập</h2>
  <div class="card" id="e-card">
    <span class="chip">Bảng so sánh</span><span class="counter" id="e-count">Đã ghép 0/6</span>
    <p class="muted" style="margin:0;font-size:13.5px">Phân biệt di truyền liên kết với di truyền phân li độc lập. Chọn thẻ rồi chạm ô (hoặc kéo thả); chạm ô đã ghép để gỡ ra.</p>
    <table class="cmp"><tr><th class="rl"></th><th class="a">Liên kết gene</th><th class="b">Phân li độc lập</th></tr>
      <tr><th class="rl">Sự di truyền các tính trạng</th><td class="slot" data-cell="r1a">Thả thẻ</td><td class="slot" data-cell="r1b">Thả thẻ</td></tr>
      <tr><th class="rl">Sự phân bố của các gene quy định các tính trạng</th><td class="slot" data-cell="r2a">Thả thẻ</td><td class="slot" data-cell="r2b">Thả thẻ</td></tr>
      <tr><th class="rl">Biến dị tổ hợp ở đời con</th><td class="slot" data-cell="r3a">Thả thẻ</td><td class="slot" data-cell="r3b">Thả thẻ</td></tr>
    </table>
    <div class="tray"></div>
    <div><button class="qbtn" id="e-check" disabled>Kiểm tra</button></div>
    <div class="fb" id="e-fb"></div>
  </div>
  <div class="card hide" id="e-bonus"></div>`;
  say('Bây giờ em hãy phân biệt di truyền liên kết với phân li độc lập bằng cách hoàn thành <b>bảng so sánh</b> dưới đây. Em kéo các thẻ vào đúng ô.','table');
  const cards=[
    {id:'a1',html:'Các tính trạng di truyền cùng nhau'},{id:'b1',html:'Các tính trạng di truyền riêng rẽ'},
    {id:'a2',html:'Các cặp gene cùng nằm trên một cặp NST tương đồng'},{id:'b2',html:'Các cặp gene nằm trên các cặp NST tương đồng khác nhau'},
    {id:'a3',html:'Hạn chế sự xuất hiện biến dị tổ hợp'},{id:'b3',html:'Làm xuất hiện nhiều biến dị tổ hợp'},
    {id:'x',html:'Không có biến dị tổ hợp'}];
  const b=board($('#e-card'),cards,{r1a:'a1',r1b:'b1',r2a:'a2',r2b:'b2',r3a:'a3',r3b:'b3'},n=>{$('#e-count').textContent=`Đã ghép ${n}/6`;$('#e-check').disabled=n<6;});
  $('#e-check').onclick=()=>{
    const fb=$('#e-fb');
    if(b.check()){
      b.lock(); $('#e-check').disabled=true;
      fbShow(fb,'ok','<b>Chính xác!</b> <b>Liên kết gene:</b> các tính trạng di truyền cùng nhau, các cặp gene cùng nằm trên một cặp NST tương đồng, hạn chế biến dị tổ hợp. <b>Phân li độc lập:</b> các tính trạng di truyền riêng rẽ, các cặp gene nằm trên các cặp NST khác nhau, làm xuất hiện nhiều biến dị tổ hợp.');
      say('Câu thêm: ý nghĩa của hai quy luật này là gì? Em ghép mỗi quy luật với ý nghĩa của nó.','meaning');
      const bo=$('#e-bonus'); bo.classList.remove('hide');
      bo.innerHTML=`<span class="chip">Ý nghĩa</span><h3>Ghép mỗi quy luật với ý nghĩa của nó</h3>
        <div class="slots2"><div><div class="count" style="color:var(--blue);font-weight:700">Liên kết gene</div><div class="slot" data-cell="m1" style="margin-top:4px">Thả thẻ</div></div>
        <div><div class="count" style="color:var(--orange);font-weight:700">Phân li độc lập</div><div class="slot" data-cell="m2" style="margin-top:4px">Thả thẻ</div></div></div>
        <div class="tray"></div><div><button class="qbtn" id="m-check" disabled>Kiểm tra</button></div><div class="fb" id="m-fb"></div>`;
      const mb=board(bo,[{id:'p',html:'Tạo ra sự đa dạng, phong phú của sinh vật sinh sản hữu tính'},{id:'l',html:'Đảm bảo sự di truyền bền vững của nhóm tính trạng luôn đi cùng nhau'}],{m1:'l',m2:'p'},n=>{$('#m-check').disabled=n<2;});
      $('#m-check').onclick=()=>{ const f=$('#m-fb');
        if(mb.check()){ mb.lock(); fbShow(f,'ok','<b>Tuyệt vời!</b> Di truyền liên kết đảm bảo sự di truyền bền vững của nhóm tính trạng; phân li độc lập tạo ra sự đa dạng cho sinh giới.'); $('#m-check').disabled=true; unlock(5); }
        else fbShow(f,'no','Chưa đúng, em thử đổi vị trí hai thẻ nhé.'); };
      setTimeout(()=>bo.scrollIntoView({behavior:'smooth',block:'nearest'}),300);
    } else fbShow(fb,'no','Có ô chưa đúng, em xem lại hoạt ảnh giảm phân ở bước Giải thích rồi thử lại nhé.');
  };
  return stop3d;
}
